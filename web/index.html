<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>iCloud Desk</title>
  <link rel="icon" href="/assets/apps/icloud.png" />
  <script>
    // Apply the theme before first paint to avoid a white flash in dark mode.
    (function () {
      var pref = 'system';
      try { pref = JSON.parse(localStorage.getItem('icd.theme')) || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/calendar.css" />
  <link rel="stylesheet" href="/css/reminders.css" />
  <link rel="stylesheet" href="/css/notes.css" />
  <link rel="stylesheet" href="/css/drive.css" />
  <link rel="stylesheet" href="/css/photos.css" />
  <link rel="stylesheet" href="/css/contacts.css" />
  <link rel="stylesheet" href="/css/findmy.css" />
  <link rel="stylesheet" href="/css/hme.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <div id="root">
    <div class="center-screen boot">
      <img class="boot-logo" src="/assets/apps/icloud.png" alt="" />
    </div>
  </div>
  <div id="toasts"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
